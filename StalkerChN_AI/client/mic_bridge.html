<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StalkerChN_AI — голосовой микрофон-мост для игры</title>
<style>
  body { font-family: Consolas, monospace; background:#101413; color:#c8d6cf; padding:24px }
  h1 { color:#7fbf7f; font-size:20px }
  .row { margin:10px 0 }
  button { background:#2e4a3a; color:#dff; border:1px solid #5a8; padding:10px 18px; cursor:pointer }
  button.active { background:#7a3b3b; border-color:#c66 }
  pre { background:#000; padding:12px; max-height:300px; overflow:auto; color:#9c9 }
  .stat { color:#fbd68a }
</style>
</head>
<body>
<h1>☢ StalkerChN_AI · микрофонный мост (PTT: клавиша <kbd>V</kbd>)</h1>
<div class="row">
  <button id="btnConnect">Подключить микрофон</button>
  <button id="btnPtt" disabled>Говорить (зажать V)</button>
  <span class="stat" id="status">не подключено</span>
</div>
<pre id="log"></pre>

<script>
// =================== НАСТРОЙКИ ===================
const SERVER_WS = "ws://127.0.0.1:8765/ws/voice";
const SAMPLE_RATE = 16000;          // должен совпадать с config/settings.ini [audio]
const PTT_KEY = "KeyV";             // push-to-talk
// =================================================

let ws=null, audioCtx=null, mediaStream=null, workletNode=null, analyser=null;
let sending=false, voiceActivity=false;
const logEl=document.getElementById("log"), statusEl=document.getElementById("status");
const btnC=document.getElementById("btnConnect"), btnP=document.getElementById("btnPtt");
const say=(m)=>{ logEl.textContent+=m+"\n"; logEl.scrollTop=1e9; };

// Простой AudioWorklet прямо отсюда (blob), чтобы не поднимать сервер статики
const WORKLET=`
class Cap extends AudioWorkletProcessor {
  process(inputs){
    const ch=inputs[0][0];
    if(ch) this.port.postMessage(ch.slice(0)); // f32 mono
    return true;
  }
}
registerProcessor('cap',Cap);`;

async function connect(){
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){ say("❌ Микрофон недоступен: "+e); return; }
  audioCtx=new AudioContext({sampleRate:SAMPLE_RATE});
  await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:"text/javascript"})));
  const src=audioCtx.createMediaStreamSource(mediaStream);
  workletNode=new AudioWorkletNode(audioCtx,"cap");
  src.connect(workletNode);
  analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; src.connect(analyser);

  ws=new WebSocket(SERVER_WS);
  ws.binaryType="arraybuffer";
  ws.onopen=()=>{ statusEl.textContent="онлайн, ждите NPC рядом"; btnP.disabled=false; say("✅ WS подключён"); };
  ws.onclose=()=>{ statusEl.textContent="сервер отключился"; btnP.disabled=true; say("⚠ WS закрыт. Запущен ли python main.py?"); };
  ws.onerror=()=>say("⚠ Ошибка сокета (сервер ИИ не запущен?)");
  ws.onmessage=(e)=>{ try{ const d=JSON.parse(e.data); say("← "+(d.pong?"pong":"["+d.type+"] "+(d.say||d.text||JSON.stringify(d)))); }catch(_){} };

  workletNode.port.onmessage=(e)=>{
    if(!sending || !ws || ws.readyState!==1) return;
    // RMS-гейт: тишина не уходит в сеть
    const buf=e.data; let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    const rms=Math.sqrt(s/buf.length);
    voiceActivity = rms > 0.012;
    if(rms>0.008) ws.send(buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength));
  };

  // индикатор голоса + авто-конец фразы после паузы
  setInterval(()=>{
    if(!analyser) return;
    const t=new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(t);
    let s=0; for(const v of t) s+=v*v;
    const rms=Math.sqrt(s/t.length);
    statusEl.textContent = sending ? (rms>0.012?"🎙 говорите…":"🔇 слушаете") : "PTT выключен";
    if(sending && !voiceGate(rms)){ idleMs+=16; if(idleMs>900){ stopSend(true);} }
    else idleMs=0;
  },16);
  btnC.textContent="Микрофон активен";
}

// --- PTT / VOX ---
let holdStart=0, idleMs=0, gateOn=false, silenceMs=0;
function voiceGate(rms){
  if(sending){ if(rms<0.012){ silenceMs+=100; return silenceMs<700; } silenceMs=0; return true; }
  return false;
}
function startSend(){ if(gateOn||!ws||ws.readyState!==1)return; gateOn=true; sending=true; holdStart=performance.now();
  // заголовок: радиус слышимости можно менять на ходу
  const hdr=new TextEncoder().encode(JSON.stringify({radius:25, player_pos:window.__scnaiPlayerPos||[0,0,0]}));
  const pkt=new Uint8Array(8+hdr.length); pkt.set(new TextEncoder().encode("SNAIHDR!")); pkt.set(hdr,8); ws.send(pkt);
  say("▶ запись"); }
function stopSend(auto){ if(!gateOn)return; gateOn=false; sending=false;
  if(ws&&ws.readyState===1){
    if(performance.now()-holdStart<700 && !auto){ say("⏹ слишком коротко, игнор"); }
    ws.send(JSON.stringify({end_of_speech:true}));
  }
  say("■ конец ("+(auto?"пауза":"отпускание")+")"); }

document.addEventListener("keydown",e=>{ if(e.code===PTT_KEY&&!e.repeat) startSend(); });
document.addEventListener("keyup",  e=>{ if(e.code===PTT_KEY) stopSend(false); });
btnC.onclick=connect;
btnP.onmousedown=()=>startSend(); btnP.onmouseup=()=>stopSend(false);
say("1) Запустите сервер: python scripts/server/main.py\n2) Нажмите «Подключить микрофон»\n3) В игре держите V и говорите — ближайший NPC ответит.");
</script>
</body>
</html>
