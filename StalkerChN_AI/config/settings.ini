# ============================================================
#  StalkerChN_AI — конфигурация голосового AI-мода для S.T.A.L.K.E.R.
#  (аналог CodoldAIValley для Stardew Valley, но для Чистого Неба)
#  Кодировка: UTF-8. Комментарии после '#'.
# ============================================================

[server]
host = 127.0.0.1
port = 8765
; Протокол: websocket (стриминг микрофона) + http (остальные эндпоинты)

[audio]
; Формат аудио, которое присылает игра/клиент
sample_rate = 16000
channels    = 1
encoding    = pcm_f32le     ; pcm_f32le | pcm_s16le | wav | webm
; Порог VOX/VAD в клиенте (уровень RMS ниже порога не отправляется)
vox_threshold = 0.012
; Минимальная длительность высказывания (сек), короче — игнорируем
min_utterance_sec = 0.7
; Максимум секунд на одну реплику игрока (дальше — принудительная сегментация)
max_utterance_sec = 30

[stt]
; Бэкенд распознавания речи: faster-whisper | vosk | openai
backend = faster-whisper
language = ru
; faster-whisper:
model = small          ; tiny | base | small | medium | large-v3 | distil-small.en...
device = cpu           ; cpu | cuda
compute_type = int8    ; float16 | int8 | int8_float16 (для cuda: float16)
; vosk:
vosk_model_path = models/vosk-ru-0.42
; openai (whisper-1 / whisper API, нужен api_key в llm.openai или env):
openai_stt_model = whisper-1

[llm]
; Бэкенд генерации ответов NPC: ollama | openai | anthropic | localgguf | mock
backend = ollama
; --- Ollama (локально, бесплатно, рекомендуется) ---
ollama_url = http://localhost:11434
ollama_model = qwen2.5:7b-instruct
; --- OpenAI и совместимые (LM Studio, vLLM, llama.cpp-server...) ---
openai_base_url = https://api.openai.com/v1
openai_model = gpt-4o-mini
openai_api_key =                     ; можно через env OPENAI_API_KEY
; --- Anthropic ---
anthropic_model = claude-3-5-haiku-latest
anthropic_api_key =                  ; можно через env ANTHROPIC_API_KEY
; --- Общие параметры генерации ---
temperature = 0.9
max_tokens = 220
; Жёсткий системный промпт поверх персонального (см. docs/PROMPTS.md)
safety_prompt = on

[npc]
; Сколько последних реплик помним на одного NPC (диалог + память факта)
history_turns = 12
; Память «слышал разговор» — сколько фактов храним на NPC
fact_memory_size = 30
; Время «свежести» слуха: если NPC давно не слышал игрока, тон реплики нейтральный
hearing_decay_min = 60

[reaction]
; Настроение по шкале -100..+100 и пороги реакций
offended_threshold   = -25
friendly_threshold   =  35
aggressive_threshold = -55
; Может ли NPC позвать союзников / начать драку при оскорблении фракции
allow_faction_alert  = true
faction_alert_radius = 25.0
; Кулдаун между реакциями одного NPC (сек), чтобы не спамить
reaction_cooldown = 8.0

[tts]
; Голосовой ответ NPC: off | kokoro | piper | edge | espeak
enabled = false
backend = kokoro
voice = ru
speed = 1.0
output_format = ogg            ; ogg | wav (для X-Ray: .ogg в gamedata/sounds)
cache_dir = tts_cache

[factions]
; Разрешённые фракции для обработки (пусто = все). Имена — как в save-game section
allowed = dolg, bandit, freedom, army, duty, merc, monolith, ecologist, neutral, zaton, trader

[logging]
level = INFO
file = logs/stalkernn.log
log_transcripts = true         ; писать распознанные фразы игрока (приватность!)
